<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="routine-timer">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; } 

body { 
background: #54487a; 
color: #e8e0f0; 
font-family: "Hiragino Mincho proN", serif; 
height: 100vh; 
display: flex; 
align-items: center; 
justify-content: center; }

.screen { 
display: none; 
text-align: center; 
width: 90%; 
max-width: 400px; }

.screen.active { 
display: block; }

button { 
background: #2d2438; 
color: #e8e0f0; 
border: 1px solid #4a3f5c; 
padding: 14px 24px; 
margin: 6px; 
border-radius: 6px; 
font-size: 1rem; 
cursor: pointer; 
transition: background 0.2s; }

button.hover { 
background: #3d3350; }

.selected { 
background: #6b5b95; 
border-color: #6b5b95; }

#currentTaskDisplay { 
font-size: 1.1rem; 
color: #a89bc4; 
letter-spacing: 0.1rem; 
margin-botoom: 16px; }

#timerDisplay { 
font-size: 5.5rem; 
font-weight: 300; 
letter-spacing: 0.05em; 
color: #e8e0f0; 
margin: 24px 0; } 

#groupButtonList { 
display: flex; 
flex-direction: column; 
gap: 8px; 
margin-bottom: 16px; }

#groupButtonList button{
text-align: left; }

#taskButtonList { 
display: grid; 
grid-template-columns: repeat(2, 1fr); 
gap: 8px; 
margin-bottom: 24px; } 

#taskButtonList button{
padding: 8px 16px; 
margin: 2px; 
border-radius: 24px;}


</style>
</head>

<body>
 <div class="screen active" id="selectScreen">
  <div id="groupButtonList"></div>
  <div id="taskButtonList"></div>
  <button id="confirmTaskBtn">これで決定</button>
 </div>

 <div class="screen" id="timeSelectScreen">
  <div id="timeListDisplay"></div>
  <button class="timeBtn" data-minutes="15">15分</button>
  <button class="timeBtn" data-minutes="30">30分</button>
  <button class="timeBtn" data-minutes="45">45分</button>
  <button class="timeBtn" data-minutes="60">60分</button>
 </div>

 <div class="screen" id="timerScreen">
  <div id="currentTaskDisplay"></div>
  <div id="timerDisplay"></div>
  <div id="taskListDisplay"></div>
 <button id="finishTaskBtn">完了</button>
 </div>

 <div class="screen" id="endScreen">
 <button id="returnTaskBtn">タスク選択へ戻る</button>
 </div>


<script> 

const selectScreen = document.getElementById("selectScreen");  
const timeSelectScreen = document.getElementById("timeSelectScreen"); 

const groupCount = 6; 

let groupButtons = []; 

function updateGroupButtonLabel(index)
{const group = selectedGroups[index]; 
const btn = groupButtons[index]; 
if(group.taskNames.length === 0)
{btn.textContent = "箱" + (index + 1);} 
else{btn.textContent = "箱" + (index + 1) + ":" + group.taskNames.join("・"); }}

const groupButtonList = document.getElementById("groupButtonList"); 

let activeGroupIndex = 0; 

let selectedGroups = 
[{ taskNames: []}, {taskNames: []}, {taskNames: []}, {taskNames: []}, {taskNames: []}, {taskNames: []}];

selectedGroups.forEach(function(group, index){
const btn = document.createElement("button"); 
btn.textContent = "箱" + (index + 1); 
if (index ===0 ){
btn.classList.add("selected")}; 
btn.addEventListener("click", function(){
document.querySelectorAll(".groupBtn").forEach(function(b){
b.classList.remove("selected"); }); 
btn.classList.add("selected"); 
activeGroupIndex = index; 
console.log("アクティブな箱", activeGroupIndex); }); 
btn.classList.add("groupBtn"); 
groupButtons.push(btn); 
groupButtonList.appendChild(btn); }); 



const tasks = ["フロ", "顔", "髪", "服", "荷物", "準備"] 

const taskButtonList = document.getElementById("taskButtonList"); 

let selectedTasks = [];

let currentGroupIndex = 0; 

tasks.forEach(function(taskName){
const btn = document.createElement("button"); 
btn.textContent = taskName; 
btn.addEventListener("click", function()
{const found = selectedGroups[activeGroupIndex].taskNames.find(function(t){return t === taskName}); 
if(found){selectedGroups[activeGroupIndex].taskNames = selectedGroups[activeGroupIndex].taskNames.filter(function(t){return t !== taskName;}); btn.classList.remove("selected"); }
else{selectedGroups[activeGroupIndex].taskNames.push(taskName); 
btn.classList.add("selected"); } 
updateGroupButtonLabel(activeGroupIndex); 
console.log(JSON.stringify(selectedGroups, null, 2)); 
}); 
taskButtonList.appendChild(btn); }); 





const timeListDisplay = document.getElementById("timeListDisplay"); 

const taskListDisplay = document.getElementById("taskListDisplay"); 

function renderTaskList(){taskListDisplay.innerHTML = ""; 
usedGroups.forEach(function(group, index)
{const row = document.createElement("div"); 
const minutes = Math.floor(group.remainingSeconds / 60);
const seconds = group.remainingSeconds % 60; 
const timeText = String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0"); 
row.textContent = group.taskNames.join("・") + " " + timeText; 
row.id = "taskRow" + index; 
taskListDisplay.appendChild(row); }); };


let usedGroups = []; 


const confirmTaskBtn = document.getElementById("confirmTaskBtn"); 

confirmTaskBtn.addEventListener("click", function()
{usedGroups = selectedGroups.filter(function(group){return group.taskNames.length > 0;});
if(usedGroups.length === 0){alert("タスクが未選択"); 
return; }
console.log("使う箱:", usedGroups); 
selectScreen.classList.remove("active"); 
timeSelectScreen.classList.add("active"); 
timeListDisplay.textContent = usedGroups[currentGroupIndex].taskNames.join("・");
});

 
const finishTaskBtn = document.getElementById("finishTaskBtn"); 
const endScreen = document.getElementById("endScreen"); 

finishTaskBtn.addEventListener("click", function(){finishCurrentTask()}); 


const returnTaskBtn = document.getElementById("returnTaskBtn"); 

returnTaskBtn.addEventListener("click", function(){endScreen.classList.remove("active"); selectScreen.classList.add("active"); 
currentGroupIndex = 0; 
selectedTasks = []; 
document.querySelectorAll(".selected").forEach(function(btn){btn.classList.remove("selected")}); 
activeGroupIndex = 0; 
selectedGroups = [{ taskNames: []}, {taskNames: []}, {taskNames: []}, {taskNames: []}, { taskNames: []}, { taskNames: []} ]; 
document.querySelectorAll(".groupBtn")[0].classList.add("selected"); 
selectedGroups.forEach(function(group, index){updateGroupButtonLabel(index); }); 
});


const timerDisplay = document.getElementById("timerDisplay"); 
const timerScreen = document.getElementById("timerScreen"); 

let remainingSeconds = 15 * 60; 

let endTime = null; 

let timerId; 

const currentTaskDisplay = document.getElementById("currentTaskDisplay"); 

const timeBtns = document.querySelectorAll(".timeBtn"); 


timeBtns.forEach(function(btn){  //timeBtnsの一つ一つにbtnという名前を付けて処理していく

btn.addEventListener("click",function(){  //btnがclickされたときの動き

const selectedMinutes = Number(btn.dataset.minutes); 　　//btnのデータセットのminutesの文字列を数値に変換してselectedMinutesとして宣言する
remainingSeconds = selectedMinutes * 60; 　　
usedGroups[currentGroupIndex].minutes = selectedMinutes; 
usedGroups[currentGroupIndex].remainingSeconds = selectedMinutes * 60
if(currentGroupIndex + 1 < usedGroups.length){
currentGroupIndex = currentGroupIndex + 1; 
timeListDisplay.textContent = usedGroups[currentGroupIndex].taskNames.join("・");}
else{currentGroupIndex = 0; 
remainingSeconds = usedGroups[currentGroupIndex].remainingSeconds; 
timeSelectScreen.classList.remove("active"); 
timerScreen.classList.add("active"); 
currentTaskDisplay.textContent = usedGroups[currentGroupIndex].taskNames.join("・"); 
renderTaskList(); 
updateDisplay(); 
startTimer();} }); }); 

 

function updateDisplay(){
const minutes = Math.floor(remainingSeconds / 60); 
const seconds = remainingSeconds % 60; 
const timeText = String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0"); 
timerDisplay.textContent = timeText; 
const taskTime = document.getElementById("taskRow" + currentGroupIndex); 
taskTime.textContent = usedGroups[currentGroupIndex].taskNames.join("・") +  " "  + timeText;  
currentTaskDisplay.textContent = usedGroups[currentGroupIndex].taskNames.join("・"); }; 


function finishCurrentTask(){
clearInterval(timerId); 
const finishTask = document.getElementById("taskRow" + currentGroupIndex); 
finishTask.textContent = usedGroups[currentGroupIndex].taskNames.join("・") + " " + "00:00"; 
currentGroupIndex = currentGroupIndex + 1; 
if (currentGroupIndex < usedGroups.length)
{remainingSeconds = usedGroups[currentGroupIndex].remainingSeconds; 
updateDisplay(); 
startTimer(); }
else {timerScreen.classList.remove("active"); 
endScreen.classList.add("active"); }}

function startTimer(){
clearInterval(timerId); 
endTime = Date.now() + remainingSeconds * 1000; 
timerId =  setInterval(function(){ 
remainingSeconds = Math.round((endTime - Date.now()) / 1000); 
if (remainingSeconds <= 0) {finishCurrentTask(); }
updateDisplay(); }, 1000); } 

document.addEventListener("visibilitychange", function(){
if(document.visibilityState === "visible" && endTime !== null){
remainingSeconds = Math.round((endTime - Date.now()) / 1000); 
updateDisplay(); 
}}); 



 </script>
 
</body>
</html>
